name: multi-platform-build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Установка системных зависимостей для Linux ---
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev

      # --- Кэширование wxWidgets для ускорения повторных сборок ---
      - name: Cache wxWidgets
        uses: actions/cache@v4
        with:
          path: build/_deps/wxwidgets-*
          key: wx-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wx-${{ matrix.name }}-

      # --- Конфигурация и сборка ---
      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      # --- Загрузка готовых артефактов ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple2DAvatar-${{ matrix.name }}
          path: build/bin/Release/